<html>
<head>
    <!-- The <meta> tag is used to provide metadata about the HTML document. 
         In this case, it is used to set up an automatic redirection. -->
    <meta http-equiv="refresh" content="0; url=http://192.168.72.132/" />
    <!-- 
        - http-equiv="refresh": This attribute tells the browser to refresh the page.
        - content="0; url=http://192.168.72.132/": 
            - The "0" indicates the number of seconds to wait before redirecting. 
            - The "url=" part specifies the destination URL to which the user will be redirected.
            - In this case, the user will be redirected immediately (0 seconds) to the URL http://192.168.72.132/.
    -->
</head>
</html>
