<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <link rel="icon"href="/images/favicon.ico" type="image/x-icon" >
        <title>Login</title>
    </head>
     <body>

        <form action="index.php" method="POST" enctype="multipart/form-data">

            <label for="username">username : </label>
            <input type="text" id="username" placeholder="budianto" minlength="4" maxlength="16" required><br>

        

            <label for="password">password : </label>
            <input type="password" id="password" minlength="8" maxlength="32" required><br>

            <label for="email">email : </label>
            <input type="email" id="email" placeholder="fake@gmail.com"><br>

            <label for="phone">phone : </label>
            <input type="tel" id="phone" placeholder="81-234-567-89" pattern="[0-9]{2}-[0-9]{3}-[0-9]{3}-[0-9]{2}"><br>

            <label for="bday">birthdate : </label>
            <input type="date" id="bday"><br>

            <label for="quantity">quantity : </label>
            <input type="number" id="quantity" min="0" max="99" value="1"><br>

            <label for="title">title : </label> 

            <label for="Mr.">Mr.</label>
            <input type="radio" id="Mr." value="Mr." name="title">

            <label for="Ms.">Ms.</label>
            <input type="radio" id="Ms." value="Ms." name="title"><br>

            <label for="payment">payment</label>
            <select id="payment">
                <option value="visa">visa :</option>
                <option value="paypal">paypal :</option>
                <option value="bitcoin">bitcoin :</option>
            </select><br>

            <label for="sub">subscribe</label>
            <input type="checkbox" id="sub"><br>

            <label for="comment">comment :</label>
            <textarea id="comment" rows="3" cols="25"></textarea><br>

            <label for="file">file : </label>
            <input type="file" id="file" accept="image/png, image/jpeg"><br><br><br>


            <input type="submit">
            <input type="reset">
            
        </form>
        




     </body>





























</html>
